<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>%sveltekit.status% — M4</title>
		<style>
			/* The app's single dark theme, as plain hex: no stylesheet loads here. */
			:root {
				color-scheme: dark;
				--bg: #0a0a0a;
				--fg: #fafafa;
				--muted: #a1a1aa;
				--border: #27272a;
			}
			body {
				margin: 0;
				min-height: 100svh;
				display: grid;
				place-items: center;
				padding: 1.5rem;
				background: var(--bg);
				color: var(--fg);
				font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			main {
				max-width: 28rem;
				text-align: center;
			}
			h1 {
				margin: 0 0 0.5rem;
				font-size: 3rem;
				font-weight: 600;
				letter-spacing: -0.02em;
			}
			p {
				margin: 0 0 1.5rem;
				color: var(--muted);
				line-height: 1.6;
			}
			a {
				display: inline-block;
				padding: 0.5rem 1rem;
				border: 1px solid var(--border);
				border-radius: 0.625rem;
				color: inherit;
				text-decoration: none;
				font-size: 0.875rem;
				font-weight: 500;
			}
			a:hover {
				border-color: var(--muted);
			}
		</style>
	</head>
	<body>
		<!--
			Rendered when an error escapes `handle` or a `+server.ts` route — the one
			case SvelteKit cannot show `+error.svelte`, because the app itself failed
			to render. Deliberately self-contained: no JS, no external CSS, no fonts.
		-->
		<main>
			<h1>%sveltekit.status%</h1>
			<p>%sveltekit.error.message%</p>
			<a href="/">Back to home</a>
		</main>
	</body>
</html>

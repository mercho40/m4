name: Set up the workspace
description: >-
  Bun and Node at the repository's versions, Bun's package cache, a frozen
  install without lifecycle scripts, and Turborepo's remote cache when the job
  may use it. Run after actions/checkout.
inputs:
  turbo-team:
    description: >-
      The Vercel team whose Remote Cache Turborepo uses (vars.TURBO_TEAM).
      Empty for none. The job needs `id-token: write`.
    default: ""
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    # drizzle-kit, Vite, Playwright and the Vercel CLI run under Node, and
    # adapter-vercel targets nodejs24.x.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    # Saved once per lockfile: the install stays frozen, the cache only
    # spares the downloads.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    # --ignore-scripts skips apps/web's `prepare` (svelte-kit sync): its
    # check-types runs the sync itself, and the SvelteKit Vite plugin does for
    # build and test.
    - shell: bash
      run: |
        bun install --frozen-lockfile --ignore-scripts
        grep -q '"lockfileVersion": 1' bun.lock || { echo "::error::bun.lock must stay at lockfileVersion 1"; exit 1; }
    # Exchanges the job's GitHub OIDC token for a short-lived Turborepo token
    # (TURBO_TOKEN and TURBO_TEAM for later steps), allowed by the team's
    # "Turborepo CLI" OIDC policy for this repository in Vercel. Without it
    # Turborepo runs uncached, which is slower but never wrong.
    - if: inputs.turbo-team != ''
      continue-on-error: true
      uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
      with:
        team: ${{ inputs.turbo-team }}
